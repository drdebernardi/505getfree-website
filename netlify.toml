# 505 GET FREE — Netlify build configuration
#
# The build command injects the Airtable read-only token from the
# Netlify environment variable into js/airtable-config.js so it is
# never stored in git. Set AIRTABLE_TOKEN in:
#   Netlify dashboard → Site settings → Environment variables

[build]
  publish = "."
  command = "printf 'window.AIRTABLE_TOKEN = \"%s\";\n' \"$AIRTABLE_TOKEN\" > js/airtable-config.js"
